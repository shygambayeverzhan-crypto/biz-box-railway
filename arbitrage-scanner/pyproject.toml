[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbscanner-telegram"
version = "0.1.0"
description = "Public-market cross-exchange opportunity scanner for Telegram"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.31.0",
  "httpx==0.28.1",
  "aiosqlite==0.21.0",
  "pydantic-settings==2.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

